# dual-plc overlay: adds a second PLC container (plc2) on the same Modbus bus.
# HMI polls both. Used to study how the LOF detector behaves when memory state
# is correlated across redundant nodes.
services:
  plc2:
    build:
      context: ../containers/plc
    container_name: troia-plc2
    hostname: plc2
    networks:
      troia-net:
        ipv4_address: 172.30.0.11
    ports:
      - "8090:8080"
      - "5022:502"
    volumes:
      - plc2-data:/opt/openplc/webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/502 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  plc:
    environment:
      - CONFIG_NAME=dual-plc

volumes:
  plc2-data:
