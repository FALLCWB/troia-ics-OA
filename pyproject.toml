[project]
name = "troia-ics"
version = "0.1.0"
description = "Container-based ICS emulation testbed for behavioral anomaly detection over supply-chain compromise scenarios"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Filipe Augusto da Luz Lemos", email = "filipe@falleng.com.br" },
]
keywords = [
    "industrial-control-systems",
    "ics",
    "supply-chain-security",
    "behavioral-anomaly-detection",
    "memory-forensics",
    "modbus",
    "openplc",
    "scadabr",
]

dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scapy>=2.5",
    "pymodbus>=3.6",
    "matplotlib>=3.8",
    "psutil>=5.9",
    "docker>=7.0",
    "filelock>=3.13",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
troia-detect = "monitor.detector:main"
troia-inject = "attacker.inject:main"
troia-aggregate = "analysis.aggregate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor", "metrics", "attacker", "analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
